# 可改。預設對齊 Pelland：直接 ≈1.0、協同 ≈0.5。
# 沒列到的動作：該組不計入 Volume（不要瞎猜）。

citation_ids: [pelland2026]
default_direct: 1.0
default_synergist: 0.5

movements:
