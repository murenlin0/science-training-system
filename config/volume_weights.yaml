  bench: [{m: 胸, w: 1.0}, {m: 三頭, w: 0.5}, {m: 前三角, w: 0.5}]
  deadlift: [{m: 股二, w: 1.0}, {m: 臀, w: 1.0}, {m: 背闊, w: 0.5}, {m: 斜方, w: 0.5}]
  ohp: [{m: 前三角, w: 1.0}, {m: 三頭, w: 0.5}]
  push_press: [{m: 前三角, w: 1.0}, {m: 三頭, w: 0.5}]
  z_press: [{m: 前三角, w: 1.0}, {m: 腹, w: 0.5}]
  pullup: [{m: 背闊, w: 1.0}, {m: 二頭, w: 0.5}]
  weighted_pullup: [{m: 背闊, w: 1.0}, {m: 二頭, w: 0.5}]
  weighted_dip: [{m: 胸, w: 1.0}, {m: 三頭, w: 0.5}]
  planche: [{m: 前三角, w: 1.0}, {m: 二頭, w: 0.5}]
  front_lever: [{m: 背闊, w: 1.0}, {m: 二頭, w: 0.5}]
  lateral_raise: [{m: 側三角, w: 1.0}]
  barbell_curl: [{m: 二頭, w: 1.0}]
  hammer_curl: [{m: 二頭, w: 1.0}]
