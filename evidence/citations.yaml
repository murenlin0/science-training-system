# 單一引用來源。規則只寫 citation_ids，不內嵌書目字串。
# grade: A = Position Stand / 高質量系統評價或統合分析
#        B = 單篇 RCT、驗證研究、機制綜述
#        C = 教練體系、書籍、論壇、無同儕審查數字
# 本表只登記來源，不賦予強制力。強制力見各層檔案。

