      - "引體每週 2 次；同一 phase 內 VL25 優於 VL50"
    caveats:
      - "頻率／疲勞觀察，不是輔助動作 RCT"

  - id: scharer2016_hold
    ref: "Schärer C, Tacchelli L, Göpfert B, et al. Accuracy of prediction of maximum resistance at increased holding times based on a three seconds maximum static strength test of the three main strength elements on rings. Sci Gymnast J. 2016;8(2):125-134."
    grade: B
    type: applied-study
    n: 10
    source: investigation
    key_findings:
      - "吊環十字／support scale／swallow：3s 最大阻力可估 5s／7s 加掛重"
    caveats:
      - "瑞士國家隊吊環。不是地板俄挺秒數定律，不當類型 I 的公斤 1RM"

  - id: lum2019
    ref: "Lum D, Barbosa TM. Brief review: effects of isometric strength training on strength and dynamic performance. 2019."
    grade: B
    type: review
    source: author
    key_findings:
      - "等長肌力處方常用 80–100% MVC、短持、累積秒數"
    caveats:
      - "單位是 MVC，不是 max-hold 時間。套到俄挺秒數是啟發式"

  - id: oranchuk2019
    ref: "Oranchuk DJ, et al. Isometric training and long-term adaptations. 2019."
    grade: B
    type: review
    source: author
    key_findings:
      - "肌腱／膠原適應常引用較高 %MVC"
    caveats:
      - "同樣是 MVC，不是體操 hold 秒數"

  - id: wang_shan2023
    ref: "Wang X, Shan G. Insights from a Nine-Segment Biomechanical Model and Its Simulation for Anthropometrical Influence on Individualized Planche Learning and Training in Gymnastics. Bioengineering. 2023;10(7):761."
    doi: "10.3390/bioengineering10070761"
    grade: B
    type: biomechanical-model
    source: investigation
    key_findings:
      - "地板俄挺的關鍵控制是肩與腕的節段角，不是「臥推力量夠不夠」"
      - "身高／肢段比例會改變所需肩腕力矩；同樣秒數對不同體型不是同一難度"
    caveats:
      - "模擬與力學模型，不是輔助動作訓練試驗，也不是週期化 RCT"

  - id: rosaci2025
    ref: "Rosaci G, Nigro F, Cortesi M, Ciacci S, Bartolomei S, Fantozzi S. Electromyographic analysis of the support scale in gymnastics and its related preconditioning strengthening exercises. J Strength Cond Res. 2025;39(6):680-686."
    doi: "10.1519/JSC.0000000000005074"
    grade: B
    type: emg-observational
    n: 7
    source: investigation
    key_findings:
      - "吊環 support scale（文獻亦稱 planche）以肱二頭、前三角、前鋸為主"
      - "五個常用預先增強動作的肌肉協同都與本動作不同，不能當「等於俄挺」"
      - "站姿直臂啞鈴前舉（DSP）整體興奮較接近；腳撐版（SSSF）二頭／三頭比最接近"
      - "滑輪減載版較像技術／肩胛位置練習，二頭參與明顯較低"
    caveats:
      - "n=7 吊環專項；急性 EMG，不是地板俄挺 1RM／秒數進展 RCT"
      - "地板俄挺與吊環 support scale 支撐面不同，轉移要打折"

  - id: scharer2015
    ref: "Schärer C, Hübner K. The relationship between swallow, support scale and iron cross on rings and their specific preconditioning strengthening exercises. Sci Gymnast J. 2015;7(3):59-68."
    doi: "10.52165/sgj.7.3.59-68"
    grade: B
    type: applied-study
    source: investigation
    key_findings:
      - "吊環靜力（swallow／support scale／iron cross）與專項預先增強負荷有相關，常用 ≥75% 體重當吊環 hold 門檻"
    caveats:
      - "Magglingen 吊環實務，不是地板俄挺處方"
